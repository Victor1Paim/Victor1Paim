<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap">
<!-- REEL DE COMEMORAÇÃO (marcos de seguidores): contador que sobe, estouro de confete, fogos, textos que pulam e personagem.
     Camada transparente; window.render(st) desenha o quadro do instante st.t (s). -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; font-family:"Montserrat"; }
  .t { position:absolute; left:40px; right:40px; text-align:center; color:#fff; font-weight:900; paint-order:stroke fill;
       -webkit-text-stroke:14px #000; line-height:1.05; transform-origin:50% 50%; }
  .am { color:#FFD21F; }
  .pill { position:absolute; left:50%; background:#0B1F4B; color:#fff; font-weight:800; font-size:46px; padding:10px 34px 14px;
          border-radius:60px; border:5px solid #fff; white-space:nowrap; box-shadow:0 8px 22px rgba(0,0,0,.4); }
  #fx { position:absolute; inset:0; }
  svg#p { position:absolute; left:50%; transform:translateX(-50%); overflow:visible; }
</style></head>
<body>
<canvas id="fx" width="1080" height="1920"></canvas>
<div id="c"></div>
<svg id="p" width="360" height="738" viewBox="0 0 400 820">
  <defs><filter id="mao" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
  <g id="corpo" filter="url(#mao)"></g>
</svg>
<script src="personagem.js"></script>
<script>
const CORES = ["#FFD21F", "#E8174F", "#3BE36A", "#2F7BFF", "#ffffff", "#FF8A00"];
let semente = 7; const rnd = () => (semente = (semente * 16807) % 2147483647) / 2147483647;
// confetes: 2 canhões (baixo esq./dir.) disparados em T0 + chuva leve o tempo todo
const T0 = 2.2, P = [];
for (let i = 0; i < 170; i++) { const lado = i % 2 ? 1 : -1;
  P.push({ t0: T0 + rnd() * 0.25, x: lado < 0 ? 60 : 1020, y: 1500, vx: -lado * (250 + rnd() * 650), vy: -(1300 + rnd() * 900),
           g: 1500, w: 14 + rnd() * 14, h: 22 + rnd() * 18, r: rnd() * 6, vr: (rnd() - .5) * 14, cor: CORES[i % CORES.length] }); }
for (let i = 0; i < 70; i++) P.push({ t0: rnd() * 11, x: rnd() * 1080, y: -40, vx: (rnd() - .5) * 80, vy: 260 + rnd() * 200, g: 0,
  w: 12 + rnd() * 10, h: 18 + rnd() * 12, r: rnd() * 6, vr: (rnd() - .5) * 8, cor: CORES[i % CORES.length] });
const FOGOS = [[2.3, 260, 420], [2.7, 820, 360], [3.3, 540, 250], [5.2, 230, 330], [6.4, 860, 470]];
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const pop = (t, t0, d = .35) => { const x = (t - t0) / d; if (x <= 0) return 0; if (x >= 1) return 1; return 1 + Math.sin(x * Math.PI) * .25 * (1 - x) + (x - 1) * 0 ; };
window.render = st => {
  const t = st.t, cx = document.getElementById("fx").getContext("2d"); cx.clearRect(0, 0, 1080, 1920);
  for (const [t0, x, y] of FOGOS) { const a = t - t0; if (a < 0 || a > 1.1) continue;
    const r = 40 + 260 * ease(a / 0.9), al = 1 - a / 1.1;
    for (let k = 0; k < 18; k++) { const an = k / 18 * Math.PI * 2;
      cx.fillStyle = CORES[k % CORES.length]; cx.globalAlpha = al;
      cx.beginPath(); cx.arc(x + Math.cos(an) * r, y + Math.sin(an) * r + a * a * 60, 9 * al + 3, 0, 7); cx.fill(); } }
  cx.globalAlpha = 1;
  for (const p of P) { const a = t - p.t0; if (a < 0) continue;
    const x = p.x + p.vx * a + Math.sin(a * 3 + p.r) * 30, y = p.y + p.vy * a + .5 * p.g * a * a; if (y > 2000) continue;
    cx.save(); cx.translate(x, y); cx.rotate(p.r + p.vr * a); cx.fillStyle = p.cor; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(a * 5 + p.r))); cx.restore(); }
  // textos
  const n = Math.round(1000 * ease((t - 0.3) / 1.9)), num = n >= 1000 ? "1.000" : String(n);
  const s1 = t < 2.2 ? 1 : 1 + 0.28 * Math.max(0, 1 - (t - 2.2) / 0.35) * Math.sin(Math.min(1, (t - 2.2) / 0.35) * Math.PI);
  const ap = (t0, d = .3) => Math.min(1, Math.max(0, (t - t0) / d));
  let h = `<div class="t" style="top:300px;font-size:44px;opacity:${ap(0.1)}">@eagle.english.br</div>`;
  h += `<div class="t am" style="top:360px;font-size:250px;-webkit-text-stroke:22px #000;transform:scale(${(t < 0.3 ? 0 : s1).toFixed(3)})">${num}</div>`;
  const a2 = ap(2.3, .25); h += `<div class="t" style="top:620px;font-size:104px;opacity:${a2};transform:scale(${(0.6 + 0.4 * ease(a2 * 1.2) + (a2 < 1 ? .08 * Math.sin(a2 * Math.PI) : 0)).toFixed(3)})">SEGUIDORES! 🎉</div>`;
  const a3 = ap(3.4, .4); h += `<div class="t" style="top:${790 + 30 * (1 - a3)}px;font-size:54px;-webkit-text-stroke:10px #000;opacity:${a3}">Obrigado por aprender inglês<br>com a gente todo dia 💛</div>`;
  const a4 = ap(6.0, .35), sino = t > 6.3 ? Math.sin(t * 18) * 10 * Math.max(0, 1 - (t - 6.3) / 1.2) : 0;
  h += `<div class="pill" style="top:${980 + 60 * (1 - ease(a4))}px;opacity:${a4};transform:translateX(-50%)">Segue e ativa as notificações <span style="display:inline-block;transform:rotate(${sino.toFixed(1)}deg)">🔔</span></div>`;
  const a5 = ap(7.2, .4); h += `<div class="t" style="top:1090px;font-size:46px;-webkit-text-stroke:9px #000;opacity:${a5}">tem aula nova <span class="am">todo dia</span></div>`;
  document.getElementById("c").innerHTML = h;
  // personagem sobe de baixo e comemora
  const pe = document.getElementById("p"), sobe = 1 - ease((t - 0.8) / 0.6);
  pe.style.top = (1880 - 790 * 360 / 400 + 700 * sobe) + "px";
  document.getElementById("corpo").setAttribute("transform", `rotate(${(st.balanco || 0).toFixed(2)} 200 790)`);
  document.getElementById("corpo").innerHTML = personagem(st);
  document.body.dataset.pronto = "1";
};
document.fonts.load('900 60px "Montserrat"').then(() => { window.fontesOk = true; });
</script>
</body></html>
