<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap">
<!-- STORIES do Instagram (1080x1920): fundo do mar escurecido, textos grandes no padrão dos vídeos, personagem próprio.
     Área segura de story: nada importante nos 250 px de cima nem nos 330 px de baixo; deixar um espaço livre para o adesivo
     (enquete/quiz/lembrete) que o usuário coloca no app. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; font-family:"Montserrat"; background:#0b2a3a center/cover; }
  #veu { position:absolute; inset:0; background:linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.15) 40%, rgba(0,0,0,.25) 70%, rgba(0,0,0,.55)); }
  .t { position:absolute; left:50px; right:50px; text-align:center; color:#fff; font-weight:900; paint-order:stroke fill;
       -webkit-text-stroke:14px #000; line-height:1.05; }
  .am { color:#FFD21F; } .vd { color:#3BE36A; }
  .caixa { position:absolute; left:50%; transform:translateX(-50%); font-weight:800; padding:8px 26px 12px; white-space:nowrap;
           box-shadow:0 8px 20px rgba(0,0,0,.35); text-align:center; }
  .c-am { background:#FFE21A; color:#111; } .c-pr { background:#15962A; color:#fff; } .c-br { background:#fff; color:#111; }
  .c-vm { background:#D7141E; color:#fff; } .c-mr { background:#0B1F4B; color:#fff; border:5px solid #fff; border-radius:60px; }
  .selo { position:absolute; left:50%; top:270px; transform:translateX(-50%) rotate(-3deg); background:#E8174F; color:#fff; font-weight:900;
          font-size:46px; padding:6px 30px 10px; border-radius:16px; border:5px solid #fff; white-space:nowrap; }
  .vazio { position:absolute; left:120px; right:120px; height:230px; border:5px dashed rgba(255,255,255,.55); border-radius:34px;
           color:rgba(255,255,255,.75); font-weight:800; font-size:30px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .conf { position:absolute; width:22px; height:36px; border-radius:6px; opacity:.95; }
  svg#p { position:absolute; left:50%; transform:translateX(-50%); overflow:visible; }
</style></head>
<body>
<div id="veu"></div>
<div id="c"></div>
<svg id="p" width="420" height="862" viewBox="0 0 400 820">
  <defs><filter id="mao" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
  <g id="corpo" filter="url(#mao)"></g>
</svg>
<script src="personagem.js"></script>
<script>
const d = window.DADOS;
document.body.style.backgroundImage = `url('${d.fundo}')`;
document.getElementById("c").innerHTML = d.html;
const p = document.getElementById("p");
if (d.personagem) {
  const e = d.personagem, w = e.largura || 420; p.setAttribute("width", w); p.setAttribute("height", w * 820 / 400);
  p.style.top = (e.pes - 790 * w / 400) + "px";
  if (e.x != null) p.style.left = e.x + "px";
  document.getElementById("corpo").innerHTML = personagem(e);
} else p.style.display = "none";
document.fonts.load('900 60px "Montserrat"').then(() => {
  for (const el of document.querySelectorAll(".caixa")) { let f = parseFloat(getComputedStyle(el).fontSize);
    while (el.offsetWidth > 980 && f > 30) { f -= 2; el.style.fontSize = f + "px"; } }
  document.body.dataset.pronto = "1";
});
</script>
</body></html>
