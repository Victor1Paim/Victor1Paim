<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap">
<!-- FORMATO "LISTA 12" (ref. 19/11, sem mascote): selo do perfil vermelho no topo, palavra falada da vez em verde
     gigante com contorno, lista 1)…12) que se completa, cronômetro vertical à direita durante a contagem.
     Camada transparente por cima do fundo em vídeo (mar). Área segura: nada nos 250 px de cima, 400 de baixo, 150 da direita. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; font-family:"Poppins"; }
  body.opaco { background:#123 center/cover; }
  #veu { position:absolute; inset:0; background:linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.10) 40%, rgba(0,0,0,.30)); }
  .selo { position:absolute; left:50%; top:270px; transform:translateX(-50%); background:#E8174F; color:#fff; font-weight:800;
          font-size:66px; padding:6px 34px 10px; border-radius:16px; white-space:nowrap; letter-spacing:-0.01em;
          box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .pal { position:absolute; left:40px; right:40px; top:400px; text-align:center; color:#1DB31D; font-weight:900; font-size:112px;
         line-height:1; text-transform:uppercase; letter-spacing:-0.02em; paint-order:stroke fill; -webkit-text-stroke:22px #000;
         white-space:nowrap; filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)); }
  .tit { position:absolute; left:50px; right:50px; top:400px; text-align:center; color:#FDDF33; font-weight:900; font-size:96px;
         line-height:1.02; paint-order:stroke fill; -webkit-text-stroke:20px #000; letter-spacing:-0.03em; }
  .tit ~ ol { top:780px; } .tit ~ ol li { font-size:54px; line-height:64px; height:64px; }
  .sub { position:absolute; left:50%; transform:translateX(-50%); top:650px; background:#0B1F4B; color:#fff; font-weight:800;
         font-size:46px; padding:8px 34px 12px; border-radius:50px; border:5px solid #fff; white-space:nowrap; }
  ol { position:absolute; left:110px; top:560px; list-style:none; }
  li { color:#fff; font-weight:800; font-size:62px; line-height:80px; height:80px; white-space:nowrap; letter-spacing:-0.02em;
       paint-order:stroke fill; -webkit-text-stroke:12px #000; filter:drop-shadow(0 4px 3px rgba(0,0,0,.45)); }
  li.novo { color:#FDDF33; }
  .timer { position:absolute; left:828px; top:640px; width:58px; height:560px; border-radius:30px; border:7px solid #fff;
           background:rgba(255,255,255,.25); box-shadow:0 0 0 4px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.4); overflow:hidden; }
  .timer i { position:absolute; left:0; right:0; bottom:0; border-radius:22px; }
</style></head>
<body>
<div id="c"></div>
<script>
const d = window.DADOS || {selo:"@eagle.english.br", palavra:"DIZ", itens:["Sit down","Stand up","","","","","","","","","",""], novo:1, timer:0.6};
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
if (d.fundo) { document.body.classList.add("opaco"); document.body.style.backgroundImage = `url('${d.fundo}')`; }
let h = d.fundo ? `<div id="veu"></div>` : "";
h += `<div class="selo">${esc(d.selo)}</div>`;
if (d.titulo) h += `<div class="tit">${esc(d.titulo).replace(/\n/g, "<br>")}</div>`;
else if (d.palavra) h += `<div class="pal" id="pal">${esc(d.palavra)}</div>`;
if (d.sub) h += `<div class="sub">${esc(d.sub)}</div>`;
h += "<ol>" + d.itens.map((x, i) => `<li class="${i === d.novo ? "novo" : ""}">${i + 1}) ${esc(x)}</li>`).join("") + "</ol>";
if (d.timer != null) {
  const f = Math.max(0, Math.min(1, d.timer));           // 0 = vazio, 1 = cheio (tempo esgotado)
  const cor = f < 0.66 ? "#FDDF33" : "#E8174F";
  h += `<div class="timer"><i style="height:${(f * 100).toFixed(1)}%;background:${cor}"></i></div>`;
}
document.getElementById("c").innerHTML = h;
document.fonts.ready.then(() => {
  const p = document.getElementById("pal");                // palavra comprida: diminui até caber
  if (p) { let s = 112; while (p.scrollWidth > p.clientWidth && s > 60) { s -= 6; p.style.fontSize = s + "px"; } }
  document.body.dataset.pronto = "1";
});
</script>
</body></html>
