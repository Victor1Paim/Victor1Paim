<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Oswald:wght@500;600;700&display=swap">
<!-- ABERTURA ANIMADA (motion graphics) no estilo da capa produzida (templates/capa.html).
     O Python chama window.quadro(T) para cada quadro (30 fps) e tira o screenshot: animação determinística.
     Linha do tempo: selo cai (0,1 s) → título palavra por linha (0,3 s) → figuras voam pra dentro (0,5 s) e flutuam →
     faixa do DESAFIO pulsa (1,4 s) → nos últimos 0,6 s tudo voa pra fora e sobra o cenário (corte para a 1ª pergunta). -->
<style>
  :root { --amarelo:#FDDF33; --verde:#7CFD4E; --marinho:#0B1F4B; --vermelho:#E63946; --creme:#F7F3EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body { position:relative; background:#222; font-family:"Poppins"; }
  #fundo { position:absolute; inset:-20px; background-size:cover; background-position:center; filter:saturate(1.15) contrast(1.05); }
  #veu { position:absolute; inset:0;
         background:linear-gradient(rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 34%, rgba(0,0,0,0) 50%, rgba(0,0,0,.25) 78%, rgba(0,0,0,.6) 100%),
                    radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(0,0,0,.35) 100%); }
  /* brilho atrás do mascote */
  #brilho { position:absolute; left:50%; top:1020px; width:1100px; height:1100px; transform:translate(-50%,-50%);
            background:radial-gradient(circle, rgba(253,223,51,.55) 0%, rgba(253,223,51,.18) 38%, rgba(253,223,51,0) 62%); }
  #raios { position:absolute; left:50%; top:1080px; width:1500px; height:1500px; transform:translate(-50%,-50%);
           background:repeating-conic-gradient(rgba(255,255,255,.10) 0 7deg, rgba(255,255,255,0) 7deg 18deg);
           -webkit-mask:radial-gradient(circle, #000 0%, #000 25%, transparent 60%); mask:radial-gradient(circle, #000 0%, #000 25%, transparent 60%); }
  .selo { position:absolute; left:50%; top:262px; transform:translateX(-50%) rotate(-3deg); background:var(--vermelho); color:#fff;
          font-family:"Oswald"; font-weight:700; font-size:58px; letter-spacing:.04em; padding:4px 40px 10px; border-radius:18px;
          border:6px solid #fff; box-shadow:0 10px 26px rgba(0,0,0,.4); white-space:nowrap; text-transform:uppercase; }
  .titulo { position:absolute; left:50px; right:50px; top:385px; text-align:center; color:#fff; font-weight:900; font-size:128px;
            line-height:1.0; letter-spacing:-0.035em; paint-order:stroke fill; -webkit-text-stroke:20px #000; text-wrap:balance;
            filter:drop-shadow(0 10px 0 rgba(0,0,0,.35)); }
  .titulo .am { color:var(--amarelo); }
  .titulo .vd { color:var(--verde); }
  .sub { position:absolute; left:50%; transform:translateX(-50%); background:var(--marinho); color:#fff; font-weight:800; font-size:40px;
         padding:10px 34px 12px; border-radius:50px; border:5px solid #fff; white-space:nowrap; box-shadow:0 8px 22px rgba(0,0,0,.35); }
  .sub b { color:var(--amarelo); }
  /* balão com a frase em inglês (sai do mascote) */
  .balao { position:absolute; background:var(--creme); border:7px solid var(--marinho); border-radius:46px; padding:20px 38px 24px;
           text-align:center; box-shadow:0 14px 34px rgba(0,0,0,.4); }
  .balao .en { font-weight:900; font-size:66px; color:var(--marinho); line-height:1.05; letter-spacing:-0.02em; white-space:nowrap; }
  .balao .pron { font-weight:800; font-size:32px; color:var(--vermelho); margin-top:6px; white-space:nowrap; }
  .balao:after { content:""; position:absolute; bottom:-46px; width:0; height:0; border:24px solid transparent;
                 border-top:34px solid var(--marinho); }
  .balao.esq:after { right:120px; } .balao.dir:after { left:120px; }
  #masc { position:absolute; left:50%; bottom:200px; height:880px; transform:translateX(-50%);
          filter:drop-shadow(0 0 0 #fff) drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff) drop-shadow(0 7px 0 #fff)
                 drop-shadow(0 -7px 0 #fff) drop-shadow(0 22px 26px rgba(0,0,0,.5)); }
  /* figuras (itens do flashcard / cenas do quiz) em cartõezinhos inclinados */
  .fig { position:absolute; z-index:3; width:250px; height:250px; background:#fff; border:6px solid var(--marinho); border-radius:32px;
         display:flex; align-items:center; justify-content:center; box-shadow:0 12px 28px rgba(0,0,0,.4); }
  .fig img { max-width:84%; max-height:84%; }
  .fig i { position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); font-style:normal; background:var(--amarelo); color:#111;
           font-weight:900; font-size:40px; padding:2px 18px; border-radius:30px; border:4px solid #111; white-space:nowrap; }
  .marca { position:absolute; left:50%; transform:translateX(-50%); top:1745px; color:#fff; font-weight:800; font-size:32px;
           paint-order:stroke fill; -webkit-text-stroke:8px #000; white-space:nowrap; }

  .linha { display:block; }
  .desafio { position:absolute; left:50%; background:var(--amarelo); color:#111; font-weight:900; font-size:46px; padding:10px 34px 12px;
             border-radius:24px; border:6px solid #111; white-space:nowrap; box-shadow:0 10px 26px rgba(0,0,0,.4); }
  #masc, .masc { position:absolute; left:50%; bottom:200px; transform-origin:50% 100%;
          filter:drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff) drop-shadow(0 7px 0 #fff)
                 drop-shadow(0 -7px 0 #fff) drop-shadow(0 22px 26px rgba(0,0,0,.5)); }
  .fig { transform-origin:50% 50%; }
</style></head>
<body>
<div id="fundo"></div><div id="veu"></div><div id="raios"></div><div id="brilho"></div>
<div id="c"></div>
<script>
const d = window.DADOS || {};
document.getElementById("fundo").style.backgroundImage = d.fundo ? `url('${d.fundo}')` : "";
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cor = s => esc(s).replace(/\*(.+?)\*/g, '<span class="am">$1</span>');
const POS = [[40,1000,-8],[790,990,7],[40,1320,6],[790,1310,-6],[250,1560,-4],[580,1560,5]];
const figs = (d.figuras || []).slice(0, 6);
let h = `<div class="selo" id="selo">${esc(d.selo)}</div><div class="titulo" id="tit">${String(d.titulo).split("\n").map((l,i)=>`<span class="linha" id="l${i}">${cor(l)}</span>`).join("")}</div>`;
if (d.sub) h += `<div class="sub" id="sub">${d.sub}</div>`;
if (d.desafio) h += `<div class="desafio" id="des">${esc(d.desafio)}</div>`;
h += `<img class="masc" id="mf" src="${d.mascote_f}"><img class="masc" id="ma" src="${d.mascote_a}">`;
h += figs.map((f,i)=>`<div class="fig" id="f${i}" style="left:${POS[i][0]}px;top:${POS[i][1]}px;${i>3?"width:200px;height:200px":""}"><img src="${f.img}">${f.txt?`<i>${esc(f.txt)}</i>`:""}</div>`).join("");
document.getElementById("c").innerHTML = h;
const $ = id => document.getElementById(id);
const cl = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const eOut = x => 1 - Math.pow(1 - cl(x), 3);
const eBack = x => { x = cl(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eIn = x => Math.pow(cl(x), 3);
let layout = null;
function medir() {   // posições finais (iguais às da capa)
  const t = $("tit"); const linhas = String(d.titulo).split("\n").length;
  let f = 128; t.style.fontSize = f + "px";
  while ((t.offsetHeight > linhas * f + 12 || t.offsetHeight > 400) && f > 70) { f -= 4; t.style.fontSize = f + "px"; }
  let y = t.offsetTop + t.offsetHeight + 26;
  const s = $("sub"); if (s) { s.style.top = y + "px"; y += s.offsetHeight + 24; }
  const de = $("des"); if (de) { de.style.top = y + "px"; y += de.offsetHeight + 40; }
  const hm = Math.min(860, 1920 - 200 - Math.max(y, 860));
  ["mf","ma"].forEach(i => $(i).style.height = hm + "px");
  layout = {hm};
}
window.quadro = function (T) {
  if (!layout) medir();
  const D = d.duracao, sai = cl((T - (D - 0.6)) / 0.6);   // 0→1 na saída
  $("fundo").style.transform = `scale(${1.08 - 0.06 * eOut(T / 1.2)})`;
  $("raios").style.transform = `translate(-50%,-50%) rotate(${T * 10}deg)`;
  $("raios").style.opacity = 1 - sai;
  $("brilho").style.opacity = (0.75 + 0.25 * Math.sin(T * 4)) * (1 - sai);
  // selo: cai de cima com quique
  const a = eBack((T - 0.1) / 0.45);
  $("selo").style.transform = `translateX(-50%) translateY(${(1 - a) * -260 - sai * 400}px) rotate(${-3 + (1 - a) * -12}deg)`;
  $("selo").style.opacity = cl((T - 0.1) / 0.15) * (1 - sai);
  // título: cada linha "pula" com escala
  String(d.titulo).split("\n").forEach((_, i) => { const k = eBack((T - 0.3 - i * 0.18) / 0.4);
    $("l" + i).style.transform = `scale(${0.3 + 0.7 * k + sai * 0.4})`; $("l" + i).style.opacity = cl((T - 0.3 - i * 0.18) / 0.12) * (1 - sai); });
  const s = $("sub"); if (s) { const k = eOut((T - 0.75) / 0.35);
    s.style.transform = `translateX(-50%) translateY(${(1 - k) * 40}px)`; s.style.opacity = k * (1 - sai); }
  const de = $("des"); if (de) { const k = eBack((T - 1.3) / 0.4); const pulso = T > 1.7 ? 1 + 0.05 * Math.sin((T - 1.7) * 9) : 1;
    de.style.transform = `translateX(-50%) scale(${k * pulso * (1 - sai)}) rotate(${(1 - k) * 10 + 2}deg)`; de.style.opacity = cl((T - 1.3) / 0.1); }
  // mascote: sobe do chão com quique; bico abre nos intervalos de fala
  const m = eBack((T - 0.35) / 0.5), aberta = (d.boca || []).some(([x, y]) => T >= x && T < y);
  ["mf","ma"].forEach(i => { $(i).style.transform = `translateX(-50%) translateY(${(1 - m) * 700 + sai * 80}px) scale(${1 - sai * 0.15}) rotate(${Math.sin(T * 1.6) * 1.2}deg)`;
    $(i).style.opacity = i === "ma" ? (aberta ? 1 : 0) : (aberta ? 0 : 1); });
  // figuras: voam de fora da tela, giram e flutuam; na saída explodem pra fora girando
  figs.forEach((f, i) => { const el = $("f" + i), p = POS[i], esq = p[0] < 540;
    const k = eBack((T - 0.5 - i * 0.12) / 0.55);
    const dx = (1 - k) * (esq ? -600 : 600) + sai * (esq ? -700 : 700), dy = (1 - k) * 200 + Math.sin(T * 2.2 + i * 1.3) * 14 - sai * 300;
    el.style.transform = `translate(${dx}px,${dy}px) rotate(${p[2] + (1 - k) * (esq ? -90 : 90) + Math.sin(T * 1.8 + i) * 3 + sai * (esq ? -120 : 120)}deg) scale(${1 - sai * 0.5})`;
    el.style.opacity = cl((T - 0.5 - i * 0.12) / 0.1) * (1 - eIn(sai)); });
};
document.fonts.ready.then(() => { medir(); window.quadro(0); document.body.dataset.pronto = "1"; });
</script>
</body></html>
