<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Oswald:wght@500;600;700&display=swap">
<!-- PADRÃO OFICIAL DOS VÍDEOS (docs/PADRAO_VIDEO.md), medido nos Reels publicados:
     foto do cenário em cor cheia (sem véu) · mascote grande no centro (entra depois, no ffmpeg) ·
     legendas Poppins Black com contorno preto · cartões de ponte/etiqueta em Oswald, marinho e vermelho. -->
<style>
  :root { --amarelo:#FDDF33; --verde:#7CFD4E; --marinho:#0B1F4B; --vermelho:#E63946; --creme:#F7F3EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body { position:relative; background:#333; }
  #fundo { position:absolute; inset:0; background-size:cover; background-position:center; }
  /* leve escurecido só no topo, para a legenda ler em qualquer foto */
  #topo { position:absolute; left:0; right:0; top:0; height:760px;
          background:linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,0)); }
  .leg { position:absolute; left:70px; right:70px; top:260px; text-align:center; font-family:"Poppins";
         paint-order:stroke fill; -webkit-text-stroke:14px #000; letter-spacing:-0.03em; }
  .leg div { text-wrap:balance; }
  .leg .branco { color:#fff; font-weight:900; font-size:78px; line-height:1.08; }
  .leg .en { color:var(--amarelo); font-weight:900; font-size:86px; line-height:1.05; }
  .leg .pron { color:#fff; font-weight:800; font-size:40px; margin-top:14px; -webkit-text-stroke:9px #000; letter-spacing:-0.01em; }
  .leg .pt { color:var(--verde); font-weight:900; font-size:64px; margin-top:16px; line-height:1.08; }
  .cartao { position:absolute; left:60px; right:60px; top:250px; background:var(--creme); border:7px solid var(--marinho);
            border-radius:34px; padding:34px 30px; text-align:center; text-wrap:balance; font-family:"Oswald"; font-weight:500;
            color:var(--marinho); font-size:66px; line-height:1.16; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .vermelho { color:var(--vermelho); }
  /* progresso visível (promessa numerada): "3/6" acima da legenda */
  .prog { position:absolute; left:50%; transform:translateX(-50%); top:176px; background:var(--marinho); color:#fff;
          font-family:"Poppins"; font-weight:800; font-size:34px; padding:6px 26px; border-radius:40px;
          border:4px solid #fff; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  .tag { position:absolute; left:50%; transform:translateX(-50%); top:240px; background:var(--creme);
         border:6px solid var(--marinho); border-radius:24px; padding:6px 30px; font-family:"Oswald"; font-weight:500;
         font-size:76px; color:var(--marinho); white-space:nowrap; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .pagina { position:absolute; left:50%; transform:translateX(-50%); top:380px; width:720px;
            box-shadow:0 14px 40px rgba(0,0,0,.35); border-radius:34px; }
  /* fechamento novo (dados da página de vendas) */
  .kit { position:absolute; left:0; right:0; top:420px; height:760px; }
  .kit img { position:absolute; width:290px; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,.35); border:4px solid #fff; }
  .lista { position:absolute; left:340px; right:60px; top:1170px; background:var(--creme); border:6px solid var(--marinho);
           border-radius:28px; padding:22px 30px; font-family:"Poppins"; font-weight:800; font-size:31px; color:var(--marinho); line-height:1.4; }
  .lista b { color:var(--vermelho); }
  .preco { position:absolute; left:70px; right:70px; top:420px; display:flex; flex-direction:column; align-items:center; gap:26px; }
  .preco .de { background:var(--creme); border:6px solid var(--marinho); border-radius:26px; padding:16px 40px; font-family:"Oswald";
               font-size:62px; color:var(--marinho); }
  .preco .de s { color:var(--vermelho); text-decoration-thickness:6px; }
  .preco .por { background:var(--amarelo); border:7px solid #111; border-radius:30px; padding:20px 50px 26px; text-align:center;
                font-family:"Oswald"; font-weight:700; color:#111; box-shadow:0 12px 30px rgba(0,0,0,.35); }
  .preco .por small { display:block; font-size:44px; font-weight:500; }
  .preco .por span { font-size:170px; line-height:1; }
  .preco .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; }
  .preco .chip { background:#fff; border:4px solid var(--marinho); border-radius:40px; padding:10px 26px; font-family:"Poppins";
                 font-weight:800; font-size:32px; color:var(--marinho); }
  .preco .botao { background:var(--vermelho); color:#fff; font-family:"Oswald"; font-weight:700; font-size:92px; padding:8px 60px 14px;
                  border-radius:30px; border:6px solid #fff; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .preco .prazo { background:var(--vermelho); color:#fff; font-family:"Poppins"; font-weight:800; font-size:34px; padding:8px 24px;
                  border-radius:14px; transform:rotate(-3deg); }
</style></head>
<body>
<div id="fundo"></div><div id="topo"></div>
<div id="c"></div>
<script>
const d = window.DADOS || {tipo:"frase", en:"What did you say?", pron:"/UÓT did iú SÊI/", pt:"O que você disse?"};
document.getElementById("fundo").style.backgroundImage = d.fundo ? `url('${d.fundo}')` : "";
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const red = s => esc(s).replace(/\*(.+?)\*/g, '<span class="vermelho">$1</span>');
let h = "";
if (d.tipo === "abertura") h = `<div class="leg"><div class="branco">${esc(d.texto)}</div></div>`;
else if (d.tipo === "frase") h = `${d.progresso ? `<div class="prog">${esc(d.progresso)}</div>` : ""}<div class="leg"><div class="en">${esc(d.en)}</div>
     ${d.pron ? `<div class="pron">${esc(d.pron)}</div>` : ""}${d.mostrar_pt && d.pt ? `<div class="pt">${esc(d.pt)}</div>` : ""}</div>`;
else if (d.tipo === "ponte") h = `<div class="cartao">${red(d.texto).replace(/\n/g, "<br>")}</div>`;
else if (d.tipo === "produto") { h = `<div class="tag">${red(d.tag)}</div>${d.pagina ? `<img class="pagina" src="${d.pagina}">` : ""}`;
  document.getElementById("topo").style.display = "none"; }
else if (d.tipo === "kit") { const pos = [[60,30,-6],[730,30,6],[395,0,0],[225,380,-4],[565,380,4]];
  h = `<div class="tag">${red(d.tag)}</div><div class="kit">${d.capas.map((c,i)=>`<img src="${c}" style="left:${pos[i][0]}px;top:${pos[i][1]}px;transform:rotate(${pos[i][2]}deg);z-index:${i==2?5:i}">`).join("")}</div>
       <div class="lista">${d.itens.map(red).join("<br>")}</div>`; document.getElementById("topo").style.display = "none"; }
else if (d.tipo === "preco") { h = `<div class="tag">${red(d.tag)}</div><div class="preco" style="top:400px">
       <div class="de">Separado: <s>${esc(d.de)}</s></div>
       <div class="por"><small>Kit completo hoje</small><span>${esc(d.por)}</span></div>
       <div class="chips">${d.chips.map(c=>`<div class="chip">${esc(c)}</div>`).join("")}</div>
       ${d.prazo ? `<div class="prazo">${esc(d.prazo)}</div>` : ""}
       <div class="botao">Link na bio 👆</div></div>`; document.getElementById("topo").style.display = "none"; }
document.getElementById("c").innerHTML = h;
// encolhe a legenda até caber acima da cabeça do mascote (topo do bloco em 260 px, limite 520 px de altura)
const leg = document.querySelector(".leg");
if (leg) document.fonts.ready.then(() => { let f = 1; while (leg.offsetHeight > 520 && f > 0.6) { f -= 0.04;
  leg.querySelectorAll("div").forEach(el => { el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * (f / (f + 0.04))) + "px"; }); } });
</script>
</body></html>
