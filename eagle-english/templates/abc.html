<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap">
<!-- FORMATO "ABC" (ref. do usuário 20/11): personagem próprio desenhado em SVG (traço simples, à mão), selo "1/3", título amarelo
     na tarja preta, opções A/B/C, contagem 5→1 com anel, resposta em verde + pronúncia. Camada transparente sobre o fundo em vídeo.
     window.render(estado) desenha um quadro; o montar_abc.py chama quadro a quadro. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; font-family:"Montserrat"; }
  body.opaco { background:#2a6 center/cover; }
  .ui { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; align-items:center; }
  .selo { margin-top:268px; background:#E3262E; color:#fff; font-weight:800; font-size:30px; padding:6px 18px 7px;
          border-radius:30px; box-shadow:0 3px 8px rgba(0,0,0,.35); }
  .tit { margin-top:26px; background:#0d0d0d; color:#FFD21F; font-weight:900; font-size:60px; padding:6px 20px 8px;
         text-transform:uppercase; letter-spacing:-0.01em; white-space:nowrap; }
  .op { margin-top:10px; background:rgba(8,14,40,.88); color:#fff; font-weight:800; font-size:50px; padding:5px 20px 8px;
        white-space:nowrap; border:3px solid rgba(255,255,255,.08); }
  .op.certa { background:#15962A; }
  .pron { margin-top:12px; background:#15962A; color:#fff; font-weight:800; font-size:46px; padding:5px 20px 7px; white-space:nowrap; }
  #cont { position:absolute; z-index:5; left:50%; width:118px; height:118px; transform:translateX(-50%); }
  svg#p { position:absolute; left:50%; transform:translateX(-50%); overflow:visible; }
</style></head>
<body>
<div class="ui" id="ui"></div>
<svg id="cont" viewBox="0 0 120 120"></svg>
<svg id="p" width="480" height="985" viewBox="0 0 400 820">
  <defs>
    <filter id="mao" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g id="corpo" filter="url(#mao)"></g>
</svg>
<script src="personagem.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
window.render = (st) => {
  document.body.classList.toggle("opaco", !!st.fundo);
  if (st.fundo) document.body.style.backgroundImage = `url('${st.fundo}')`;
  let h = `<div class="selo">${esc(st.rodada)}</div>`;
  if (st.fase === "revela") {
    h += `<div class="op certa">${esc(st.opcoes[st.certa])}</div><div class="pron">${esc(st.pron)}</div>`;
  } else {
    h += `<div class="tit">${esc(st.titulo)}</div>` + st.opcoes.map(o => `<div class="op">${esc(o)}</div>`).join("");
  }
  const ui = document.getElementById("ui"); ui.innerHTML = h;
  for (const el of ui.querySelectorAll(".tit,.op,.pron")) { let f = parseFloat(getComputedStyle(el).fontSize);
    while (el.offsetWidth > 900 && f > 30) { f -= 2; el.style.fontSize = f + "px"; } }
  const fim = ui.getBoundingClientRect().bottom;
  // contagem: círculo escuro com número e anel azul que esvazia
  const c = document.getElementById("cont");
  if (st.fase === "contagem") {
    const r = 52, L = 2 * Math.PI * r, f = st.anel ?? 1;
    c.style.display = "block"; c.style.top = (fim + 26) + "px";
    c.innerHTML = `<circle cx="60" cy="60" r="56" fill="#111" opacity=".92"/>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="#2F7BFF" stroke-width="6" stroke-dasharray="${L * f} ${L}" transform="rotate(-90 60 60)" stroke-linecap="round"/>
      <text x="60" y="78" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="54" fill="#fff">${st.num}</text>`;
  } else c.style.display = "none";
  // personagem: pés fixos na linha 1735; balança de leve (pivô nos pés)
  const p = document.getElementById("p"), esc_ = 480 / 400;
  p.style.top = (1775 - 790 * esc_) + "px";
  document.getElementById("corpo").setAttribute("transform", `rotate(${(st.balanco || 0).toFixed(2)} 200 790)`);
  document.getElementById("corpo").innerHTML = personagem(st);
  document.body.dataset.pronto = "1";
};
document.fonts.load('900 54px "Montserrat"').then(() => {
  if (window.DADOS) window.render(window.DADOS);
  window.fontesOk = true;
});
</script>
</body></html>
