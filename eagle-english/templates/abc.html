<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap">
<!-- FORMATO "ABC" (ref. do usuário 20/11): personagem próprio desenhado em SVG (traço simples, à mão), selo "1/3", título amarelo
     na tarja preta, opções A/B/C, contagem 5→1 com anel, resposta em verde + pronúncia. Camada transparente sobre o fundo em vídeo.
     window.render(estado) desenha um quadro; o montar_abc.py chama quadro a quadro. -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; font-family:"Montserrat"; }
  body.opaco { background:#2a6 center/cover; }
  .ui { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; align-items:center; }
  .selo { margin-top:268px; background:#E3262E; color:#fff; font-weight:800; font-size:30px; padding:6px 18px 7px;
          border-radius:30px; box-shadow:0 3px 8px rgba(0,0,0,.35); }
  .tit { margin-top:26px; background:#0d0d0d; color:#FFD21F; font-weight:900; font-size:60px; padding:6px 20px 8px;
         text-transform:uppercase; letter-spacing:-0.01em; white-space:nowrap; }
  .op { margin-top:10px; background:rgba(8,14,40,.88); color:#fff; font-weight:800; font-size:50px; padding:5px 20px 8px;
        white-space:nowrap; border:3px solid rgba(255,255,255,.08); }
  .op.certa { background:#15962A; }
  .pron { margin-top:12px; background:#15962A; color:#fff; font-weight:800; font-size:46px; padding:5px 20px 7px; white-space:nowrap; }
  #cont { position:absolute; z-index:5; left:50%; width:118px; height:118px; transform:translateX(-50%); }
  svg#p { position:absolute; left:50%; transform:translateX(-50%); overflow:visible; }
</style></head>
<body>
<div class="ui" id="ui"></div>
<svg id="cont" viewBox="0 0 120 120"></svg>
<svg id="p" width="560" height="1150" viewBox="0 0 400 820">
  <defs>
    <filter id="mao" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g id="corpo" filter="url(#mao)"></g>
</svg>
<script>
const C = { pele:"#F4C7A1", cabelo:"#3A2416", camisa:"#1F3F8F", tenis:"#ffffff", traco:"#151515", estrela:"#FFD21F" };
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// mãos-alvo relativas ao ombro (x para fora = negativo na esquerda)
const POSES = {
  neutro:   { L:[-38, 228], R:[38, 228] },
  fala1:    { L:[-128, 70], R:[36, 226] },
  fala2:    { L:[-36, 226], R:[128, 70] },
  fala3:    { L:[-150, 120], R:[150, 120] },
  fala4:    { L:[-110, 150], R:[60, 200] },
  pensando: { L:[100, 160], R:[-52, -34], olhar:[6, -8] },
  feliz:    { L:[-36, 226], R:[112, -64], joinha:true, sorriso:true },
};
const SH = { L:[125, 292], R:[275, 292] }, A = 118, B = 112;
function ik(s, t, lado) {               // braço de 2 segmentos (ombro→cotovelo→mão), cotovelo para fora/baixo
  const dx = t[0], dy = t[1]; let d = Math.hypot(dx, dy); d = Math.min(d, A + B - 1);
  const base = Math.atan2(dy, dx), cos = (A * A + d * d - B * B) / (2 * A * d), al = Math.acos(Math.max(-1, Math.min(1, cos)));
  const sg = lado === "L" ? 1 : -1, ang = base + sg * al;
  const e = [s[0] + A * Math.cos(ang), s[1] + A * Math.sin(ang)];
  const h = [s[0] + dx * d / Math.hypot(dx, dy || 1e-6), s[1] + dy * d / Math.hypot(dx, dy || 1e-6)];
  return [e, h];
}
function mistura(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
function personagem(st) {
  const P = POSES[st.pose] || POSES.neutro, Q = POSES[st.pose_ant] || P, k = st.k ?? 1;
  const alvo = l => mistura(Q[l], P[l], k);
  let g = "";
  // pernas e tênis
  g += `<path d="M170 560 L162 770 M230 560 L240 770" stroke="${C.traco}" stroke-width="10" stroke-linecap="round" fill="none"/>`;
  g += `<path d="M128 772 q34 -26 56 0 z M218 772 q34 -26 60 2 z" fill="${C.tenis}" stroke="${C.traco}" stroke-width="7" stroke-linejoin="round"/>`;
  // camiseta (tronco) com estrela
  g += `<path d="M128 282 Q200 262 272 282 L282 560 Q200 574 118 560 Z" fill="${C.camisa}" stroke="${C.traco}" stroke-width="8" stroke-linejoin="round"/>`;
  g += `<path d="M200 352 l9 20 22 2 -17 14 6 22 -20 -12 -20 12 6 -22 -17 -14 22 -2 z" fill="${C.estrela}" stroke="${C.traco}" stroke-width="4" stroke-linejoin="round"/>`;
  // braços
  for (const l of ["L", "R"]) {
    const s = SH[l], [e, h] = ik(s, alvo(l), l);
    g += `<path d="M${s[0]} ${s[1]} L${e[0]} ${e[1]} L${h[0]} ${h[1]}" stroke="${C.traco}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
    g += `<circle cx="${h[0]}" cy="${h[1]}" r="19" fill="${C.pele}" stroke="${C.traco}" stroke-width="6"/>`;
    if (P.joinha && l === "R" && k > 0.6) g += `<path d="M${h[0]} ${h[1] - 14} l0 -24" stroke="${C.traco}" stroke-width="9" stroke-linecap="round"/>`;
  }
  // cabeça
  g += `<circle cx="96" cy="160" r="20" fill="${C.pele}" stroke="${C.traco}" stroke-width="7"/><circle cx="304" cy="160" r="20" fill="${C.pele}" stroke="${C.traco}" stroke-width="7"/>`;
  g += `<circle cx="200" cy="155" r="112" fill="${C.pele}" stroke="${C.traco}" stroke-width="8"/>`;
  g += `<path d="M96 120 Q104 40 196 38 Q292 34 306 118 Q280 84 246 92 Q232 62 200 80 Q168 58 150 92 Q118 84 96 120 Z" fill="${C.cabelo}" stroke="${C.traco}" stroke-width="7" stroke-linejoin="round"/>`;
  // olhos, sobrancelhas, boca
  const ol = P.olhar || [0, 0];
  if (st.piscar) g += `<path d="M150 150 h26 M224 150 h26" stroke="${C.traco}" stroke-width="7" stroke-linecap="round"/>`;
  else g += `<ellipse cx="${163 + ol[0]}" cy="${150 + ol[1]}" rx="11" ry="16" fill="${C.traco}"/><ellipse cx="${237 + ol[0]}" cy="${150 + ol[1]}" rx="11" ry="16" fill="${C.traco}"/>`;
  const sob = st.pose === "pensando" ? -10 : (P.sorriso ? -6 : 0);
  g += `<path d="M146 ${118 + sob} q17 -9 32 -2 M222 ${116} q17 -7 32 2" stroke="${C.traco}" stroke-width="6" stroke-linecap="round" fill="none"/>`;
  const b = st.boca || 0;
  if (b === 0) g += P.sorriso ? `<path d="M166 205 q34 30 68 0" stroke="${C.traco}" stroke-width="7" stroke-linecap="round" fill="none"/>`
                 : (st.pose === "pensando" ? `<path d="M182 212 q18 -6 34 4" stroke="${C.traco}" stroke-width="7" stroke-linecap="round" fill="none"/>`
                 : `<path d="M172 207 q28 16 56 0" stroke="${C.traco}" stroke-width="7" stroke-linecap="round" fill="none"/>`);
  else if (b === 1) g += `<path d="M172 200 q28 34 56 0 q-28 6 -56 0 z" fill="#6B1F24" stroke="${C.traco}" stroke-width="6" stroke-linejoin="round"/>`;
  else g += `<ellipse cx="200" cy="212" rx="20" ry="24" fill="#6B1F24" stroke="${C.traco}" stroke-width="6"/><ellipse cx="200" cy="224" rx="11" ry="7" fill="#E46A6A"/>`;
  return g;
}
window.render = (st) => {
  document.body.classList.toggle("opaco", !!st.fundo);
  if (st.fundo) document.body.style.backgroundImage = `url('${st.fundo}')`;
  let h = `<div class="selo">${esc(st.rodada)}</div>`;
  if (st.fase === "revela") {
    h += `<div class="op certa">${esc(st.opcoes[st.certa])}</div><div class="pron">${esc(st.pron)}</div>`;
  } else {
    h += `<div class="tit">${esc(st.titulo)}</div>` + st.opcoes.map(o => `<div class="op">${esc(o)}</div>`).join("");
  }
  const ui = document.getElementById("ui"); ui.innerHTML = h;
  for (const el of ui.querySelectorAll(".tit,.op,.pron")) { let f = parseFloat(getComputedStyle(el).fontSize);
    while (el.offsetWidth > 900 && f > 30) { f -= 2; el.style.fontSize = f + "px"; } }
  const fim = ui.getBoundingClientRect().bottom;
  // contagem: círculo escuro com número e anel azul que esvazia
  const c = document.getElementById("cont");
  if (st.fase === "contagem") {
    const r = 52, L = 2 * Math.PI * r, f = st.anel ?? 1;
    c.style.display = "block"; c.style.top = (fim + 26) + "px";
    c.innerHTML = `<circle cx="60" cy="60" r="56" fill="#111" opacity=".92"/>
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="#2F7BFF" stroke-width="6" stroke-dasharray="${L * f} ${L}" transform="rotate(-90 60 60)" stroke-linecap="round"/>
      <text x="60" y="78" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="54" fill="#fff">${st.num}</text>`;
  } else c.style.display = "none";
  // personagem: pés fixos na linha 1735; balança de leve (pivô nos pés)
  const p = document.getElementById("p"), esc_ = 560 / 400;
  p.style.top = (1735 - 790 * esc_) + "px";
  document.getElementById("corpo").setAttribute("transform", `rotate(${(st.balanco || 0).toFixed(2)} 200 790)`);
  document.getElementById("corpo").innerHTML = personagem(st);
  document.body.dataset.pronto = "1";
};
document.fonts.load('900 54px "Montserrat"').then(() => {
  if (window.DADOS) window.render(window.DADOS);
  window.fontesOk = true;
});
</script>
</body></html>
