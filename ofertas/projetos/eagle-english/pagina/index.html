<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#0B1F4B">
<title>Você travaria no inglês na sua próxima viagem? · Eagle English</title>
<meta name="description" content="Responda 6 perguntas rápidas e descubra o que falta pra você se virar em inglês lá fora, sem precisar ser fluente.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Você travaria no inglês na sua próxima viagem?"><meta property="og:description" content="Teste de 1 minuto: descubra o que falta pra você se virar lá fora."><meta property="og:image" content="og.jpg">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body class="quiz-body">
<header class="wrap marca" style="color:#fff"><svg class="ic logo" viewBox="0 0 32 32" aria-hidden="true" style="color:#fff;fill:currentColor;stroke:none"><path d="M3 12c5-1 9 0 12 3 2-4 6-7 14-7-2 3-4 5-8 6 3 1 5 3 6 6-4 0-7-1-9-3l-3 7-2-6c-3 1-6 0-9-3 3 0 5-1 6-2C8 13 5 13 3 12z"/></svg><span style="color:#fff">EAGLE <b>ENGLISH</b></span></header>
<main class="quiz"><div class="qcard" id="card" aria-live="polite"></div></main>

<script src="config.js?v=3"></script>
<script>
const PERGUNTAS = [
  { k: "destino", t: "Qual viagem você tem vontade de fazer?", o: [
    ["eua", "🗽 Estados Unidos (Nova York, Orlando, Miami…)"], ["europa", "🇪🇺 Europa"],
    ["paraiso", "🏝️ Um lugar paradisíaco (Maldivas, Caribe…)"], ["trabalho", "💼 Viagem a trabalho ou intercâmbio"] ] },
  { k: "nivel", t: "Como está seu inglês hoje?", o: [
    ["zero", "Sei quase nada"], ["palavras", "Entendo algumas palavras, mas não consigo falar"],
    ["trava", "Leio bem, mas travo na hora de falar"], ["viro", "Me viro, mas quero mais segurança"] ] },
  { k: "medo", t: "Qual dessas situações te dá mais frio na barriga?", o: [
    ["aeroporto", "Imigração e aeroporto"], ["restaurante", "Pedir comida no restaurante"],
    ["emergencia", "Pedir ajuda se algo der errado (mala perdida, farmácia…)"], ["conversa", "Conversar com alguém e não entender a resposta"] ] },
  { k: "bloqueio", t: "O que mais te trava na hora de falar?", o: [
    ["frase", "Não sei qual frase usar"], ["vergonha", "Tenho vergonha da minha pronúncia"],
    ["esqueco", "Esqueço tudo na hora"], ["traduzo", "Penso em português e não consigo traduzir rápido"] ] },
  { k: "tempo", t: "Quanto tempo por dia você teria pra treinar?", o: [
    ["5", "5 minutos"], ["15", "15 minutos"], ["30", "30 minutos ou mais"] ] },
  { k: "celular", t: "Se você tivesse a frase certa no celular, pronta pra cada situação, viajaria mais tranquilo?", o: [
    ["sim", "Com certeza"], ["acho", "Acho que sim"], ["talvez", "Talvez"] ] },
];
const DESTINO = { eua: "nos Estados Unidos", europa: "na Europa", paraiso: "no paraíso", trabalho: "na sua viagem a trabalho" };
const MEDO = { aeroporto: "a imigração e o aeroporto", restaurante: "o restaurante", emergencia: "uma emergência", conversa: "uma conversa de verdade" };
const PERFIS = {
  A: { nome: "Viajante Inseguro", txt: "Você não precisa ser fluente pra viajar. Precisa saber o que dizer em cada situação e ter isso à mão quando o frio na barriga bater." },
  B: { nome: "Travado na Hora H", txt: "Você já sabe mais do que imagina. O que falta é frase pronta e treino de fala: parar de traduzir na cabeça e ter a resposta na ponta da língua." },
  C: { nome: "Quase Lá", txt: "Você já se vira. Agora é ganhar segurança: revisar as situações que mais assustam e ter tudo organizado num lugar só." },
};
const r = {}; let i = -1;
const card = document.getElementById("card");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function perfil() {
  if (r.nivel === "viro") return "C";
  if (r.nivel === "trava" || r.bloqueio === "traduzo") return "B";
  return "A";
}
function abertura() {
  card.innerHTML = `<span class="selo">Teste rápido · 1 minuto</span>
    <h1 class="disp" style="margin-top:14px">Você travaria no inglês na sua próxima viagem? ✈️</h1>
    <p>Responda 6 perguntas rápidas e descubra o que falta pra você se virar lá fora, sem precisar ser fluente.</p>
    <button class="btn btn-green btn-block" id="go">Começar o teste</button>
    <p class="mini"><a href="oferta.html${location.search}">Prefiro ver os planos direto →</a></p>`;
  document.getElementById("go").onclick = () => { i = 0; pergunta(); };
}
function pergunta() {
  const q = PERGUNTAS[i];
  card.innerHTML = `<div class="prog"><i style="width:${(i / PERGUNTAS.length) * 100}%"></i></div>
    <div class="passo-q">Pergunta ${i + 1} de ${PERGUNTAS.length}</div>
    <h2 class="disp">${esc(q.t)}</h2>
    <div class="opcoes">${q.o.map(([v, t]) => `<button class="op${r[q.k] === v ? " sel" : ""}" data-v="${v}">${esc(t)}</button>`).join("")}</div>
    ${i > 0 ? '<button class="voltar" id="back">← Voltar</button>' : ""}`;
  card.querySelectorAll(".op").forEach(b => b.onclick = () => {
    r[q.k] = b.dataset.v; b.classList.add("sel");
    setTimeout(() => { i++; i < PERGUNTAS.length ? pergunta() : resultado(); }, 180);
  });
  const bk = document.getElementById("back"); if (bk) bk.onclick = () => { i--; pergunta(); };
  card.querySelector(".op").focus({ preventScroll: true });
}
function resultado() {
  const p = PERFIS[perfil()];
  const min = r.tempo === "5" ? "5 minutos" : r.tempo === "30" ? "30 minutos" : "15 minutos";
  const q = new URLSearchParams({ perfil: perfil(), destino: r.destino || "", medo: r.medo || "" });
  new URLSearchParams(location.search).forEach((v, k) => { if (k.startsWith("utm_")) q.set(k, v); });
  card.innerHTML = `<div class="prog"><i style="width:100%"></i></div>
    <span class="res-perfil">Seu perfil: ${p.nome}</span>
    <h2 class="disp">Dá pra viajar ${DESTINO[r.destino] || "lá fora"} sem travar.</h2>
    <p>${p.txt}</p>
    <ul class="res-lista">
      <li>Comece por <b>${MEDO[r.medo] || "as situações da viagem"}</b>: é o que mais te preocupa.</li>
      <li>Treine <b>${min} por dia</b> com frases prontas, em voz alta.</li>
      <li>Leve as frases no celular, com tradução e pronúncia escrita do jeito que se fala.</li>
    </ul>
    <a class="btn btn-green btn-block" href="oferta.html?${q}#planos">Ver o plano pra minha viagem</a>
    <button class="voltar" id="refazer">Refazer o teste</button>`;
  document.getElementById("refazer").onclick = () => { for (const k in r) delete r[k]; i = 0; pergunta(); };
  try { localStorage.setItem("eagle_quiz", JSON.stringify({ ...r, perfil: perfil() })); } catch (e) {}
}
abertura();
</script>
</body>
</html>
