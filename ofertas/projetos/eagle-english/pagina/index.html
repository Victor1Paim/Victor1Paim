<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#0B1F4B">
<title>Por que o inglês ainda não pegou? · Eagle English</title>
<meta name="description" content="Teste de 1 minuto: descubra o jeito mais fácil de aprender inglês, pra você ou pro seu filho, sem decoreba.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Por que o inglês ainda não pegou?"><meta property="og:description" content="Teste de 1 minuto: descubra o jeito mais fácil de aprender, sem decoreba."><meta property="og:image" content="https://eagle-viagem.vercel.app/og.jpg">
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body class="quiz-body">
<header class="wrap marca" style="color:#fff"><img class="logo-img" src="img/logo.png" alt="" width="40" height="40"><span style="color:#fff">EAGLE <b>ENGLISH</b></span></header>
<main class="quiz"><div class="qcard" id="card" aria-live="polite"></div></main>

<script src="config.js?v=4"></script>
<script>
const PERGUNTAS = [
  { k: "obj", t: "Pra que você quer o inglês?", o: [
    ["filho", "👩‍👦 Pro meu filho estudar, sem pagar cursinho caro"], ["curso", "😓 Já fiz curso (ou a escola) e não aprendi"],
    ["viagem", "✈️ Vou viajar e não quero travar"], ["carreira", "📚 Concurso, prova ou trabalho"], ["vida", "🗣️ Entender e conversar no dia a dia"] ] },
  { k: "hist", t: "Como foi sua experiência com inglês até hoje?", o: [
    ["nunca", "Nunca estudei de verdade"], ["escola", "Só o da escola: decorei pra prova e esqueci"],
    ["caro", "Paguei cursinho caro e aprendi pouco"], ["app", "Usei aplicativo, mas larguei"] ] },
  { k: "nivel", t: "Como está o inglês hoje?", o: [
    ["zero", "Quase nada"], ["palavras", "Entende algumas palavras, mas não fala"],
    ["trava", "Lê bem, mas trava na hora de falar"], ["viro", "Se vira, mas quer mais segurança"] ] },
  { k: "trava", t: "O que mais atrapalhou até agora?", o: [
    ["decoreba", "Muita gramática e decoreba"], ["vergonha", "Vergonha da pronúncia"],
    ["tempo", "Falta de tempo e constância"], ["frase", "Não saber o que dizer na hora"] ] },
  { k: "tempo", t: "Quanto tempo por dia dá pra treinar?", o: [
    ["5", "5 minutos"], ["15", "15 minutos"], ["30", "30 minutos ou mais"] ] },
  { k: "precisa", t: "O que faria a diferença pra finalmente aprender?", o: [
    ["simples", "Uma frase por vez, sem complicação"], ["aulas", "Aulas curtinhas com alguém explicando"],
    ["pronuncia", "Saber pronunciar sem vergonha"], ["bolso", "Algo que caiba no bolso, sem mensalidade (dá pra parcelar)"] ] },
];
const PERFIS = {
  viagem:   { nome: "Viajante", tit: "Dá pra viajar sem travar no inglês.", txt: "Você não precisa ser fluente pra viajar. Precisa saber o que dizer em cada situação, do aeroporto ao jantar, e treinar a fala antes de ir." },
  filho:    { nome: "Mãe/pai que quer o melhor", tit: "Inglês de verdade pro seu filho, sem pagar cursinho caro.", txt: "As férias são o momento perfeito: aulas curtinhas, frases do dia a dia e pronúncia escrita do jeito que se lê. Ele aprende pra usar, não pra decorar e esquecer depois da prova." },
  curso:    { nome: "Cansado da decoreba", tit: "O problema não foi você. Foi o método.", txt: "Decorar pra prova faz a gente esquecer logo depois. Aqui é diferente: uma frase de verdade por vez, falada em voz alta, com a pronúncia escrita e aula curtinha." },
  carreira: { nome: "Construindo a base", tit: "Base sólida, um pouco por dia.", txt: "Pra prova, concurso ou trabalho você precisa de base: vocabulário do dia a dia, os verbos que mais aparecem e a gramática em cards simples. Sem decoreba, no seu ritmo." },
  vida:     { nome: "Quero conversar", tit: "Dá pra entender e falar no dia a dia.", txt: "Comece pelas frases que você realmente usa, treine a pronúncia em voz alta e vá juntando: em pouco tempo as respostas saem mais fácil." },
};
const DICA = { decoreba: "Troque a decoreba por frases prontas: uma por vez, em voz alta.", vergonha: "Leia a pronúncia escrita do jeito que se fala em português: a vergonha some quando você sabe como sai.",
  tempo: "Faça pouco, mas todo dia: a constância vale mais que horas no fim de semana.", frase: "Tenha as frases de cada situação organizadas, pra achar em segundos." };
const r = {}; let i = -1;
const card = document.getElementById("card");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function perfil() { return PERFIS[r.obj] ? r.obj : "vida"; }
function abertura() {
  card.innerHTML = `<span class="selo">Teste rápido · 1 minuto</span>
    <h1 class="disp" style="margin-top:14px">Por que o inglês ainda não "pegou"? 🤔</h1>
    <p>Responda 6 perguntas rápidas e descubra o jeito mais fácil de aprender, pra você ou pro seu filho, sem decoreba e sem mensalidade.</p>
    <button class="btn btn-green btn-block" id="go">Começar o teste</button>
    <p class="mini"><a href="oferta.html${location.search}">Prefiro ver os planos direto →</a></p>`;
  document.getElementById("go").onclick = () => { i = 0; pergunta(); };
}
function pergunta() {
  const q = PERGUNTAS[i];
  card.innerHTML = `<div class="prog"><i style="width:${(i / PERGUNTAS.length) * 100}%"></i></div>
    <div class="passo-q">Pergunta ${i + 1} de ${PERGUNTAS.length}</div>
    <h2 class="disp">${esc(q.t)}</h2>
    <div class="opcoes">${q.o.map(([v, t]) => `<button class="op${r[q.k] === v ? " sel" : ""}" data-v="${v}">${esc(t)}</button>`).join("")}</div>
    ${i > 0 ? '<button class="voltar" id="back">← Voltar</button>' : ""}`;
  card.querySelectorAll(".op").forEach(b => b.onclick = () => {
    r[q.k] = b.dataset.v; b.classList.add("sel");
    setTimeout(() => { i++; i < PERGUNTAS.length ? pergunta() : resultado(); }, 180);
  });
  const bk = document.getElementById("back"); if (bk) bk.onclick = () => { i--; pergunta(); };
  card.querySelector(".op").focus({ preventScroll: true });
}
function resultado() {
  const p = PERFIS[perfil()];
  const min = r.tempo === "5" ? "5 minutos" : r.tempo === "30" ? "30 minutos" : "15 minutos";
  const q = new URLSearchParams({ obj: perfil() });
  new URLSearchParams(location.search).forEach((v, k) => { if (k.startsWith("utm_")) q.set(k, v); });
  card.innerHTML = `<div class="prog"><i style="width:100%"></i></div>
    <span class="res-perfil">Seu perfil: ${p.nome}</span>
    <h2 class="disp">${p.tit}</h2>
    <p>${p.txt}</p>
    <ul class="res-lista">
      <li>${DICA[r.trava] || DICA.frase}</li>
      <li>Treine <b>${min} por dia</b>, em voz alta.</li>
      <li>Use material com tradução e <b>pronúncia escrita</b> do jeito que se lê em português.</li>
    </ul>
    <a class="btn btn-green btn-block" href="oferta.html?${q}">Ver o plano ideal pra mim</a>
    <button class="voltar" id="refazer">Refazer o teste</button>`;
  document.getElementById("refazer").onclick = () => { for (const k in r) delete r[k]; i = 0; pergunta(); };
  try { localStorage.setItem("eagle_quiz", JSON.stringify({ ...r, perfil: perfil() })); } catch (e) {}
}
abertura();
</script>
</body>
</html>
