<div class="leg" id="leg-2"><b>Nem sempre.</b></div>
<div class="leg" id="leg-3">Em São Paulo, um estudo com <b>exame do sono</b></div>

<div class="leg" id="leg-5">em <b>quase 1 em cada 3 adultos</b>.</div>

<div class="leg" id="leg-9">Esse é o <b>atalho que engana</b>.</div>

<div class="leg" id="leg-22">E a apneia <b>tem tratamento</b>.</div>

<div class="leg" id="leg-25"><b>Isso aí.</b></div>
<div class="leg" id="leg-26">Manda pra quem ronca <b>e jura que não</b>.</div>
<div class="leg" id="leg-27">E <b>curte</b>,</div>
